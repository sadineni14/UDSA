<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tasks - TodoApp</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="brand" href="index.html">✅ TodoApp</a>
  <div class="nav-links">
    <span id="userGreeting" class="text-muted"></span>
    <a href="#" class="btn btn-outline btn-sm" style="color:#fff;border-color:#fff" onclick="logout()">Logout</a>
  </div>
</nav>
<div class="container">
  <div class="grid grid-2" style="grid-template-columns: 380px 1fr;">
    <div>
      <div class="card mb-3">
        <h4>Add a Task</h4>
        <form id="taskForm">
          <label>Title</label>
          <input type="text" id="title" required>
          <label>Description</label>
          <textarea id="description" rows="2"></textarea>
          <label>Priority</label>
          <select id="priority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
          </select>
          <button class="btn btn-primary btn-block">Add Task</button>
        </form>
      </div>
      <div class="card text-center">
        <div class="grid grid-3">
          <div><h3 id="statTotal">0</h3><small class="text-muted">Total</small></div>
          <div><h3 id="statDone">0</h3><small class="text-muted">Done</small></div>
          <div><h3 id="statPending">0</h3><small class="text-muted">Pending</small></div>
        </div>
      </div>
    </div>
    <div>
      <div class="tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="active">Active</button>
        <button class="tab" data-filter="completed">Completed</button>
      </div>
      <div id="taskList"></div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;">
  <div class="card" style="width:400px;">
    <h4>Edit Task</h4>
    <form id="editForm">
      <input type="hidden" id="editId">
      <label>Title</label>
      <input type="text" id="editTitle" required>
      <label>Description</label>
      <textarea id="editDescription" rows="2"></textarea>
      <label>Priority</label>
      <select id="editPriority">
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>
      <div class="flex gap-2">
        <button class="btn btn-primary" type="submit">Save</button>
        <button class="btn btn-outline" type="button" onclick="closeEditModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>

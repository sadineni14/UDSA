<style>
.todo-root {
  --bg: #F6F5F1;
  --card: #FFFFFF;
  --line: #E5E1D8;
  --ink: #2B2B26;
  --ink-soft: #7A7A72;
  --accent: #3B6E5E;
  --accent-soft: #E7EFEC;
  --danger: #C1503F;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100%;
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 48px 16px;
  box-sizing: border-box;
}
.todo-root * { box-sizing: border-box; }
.todo-shell { width: 100%; max-width: 480px; }

.todo-title {
  font-size: 26px;
  font-weight: 700;
  margin: 0 0 4px 0;
  letter-spacing: -0.01em;
}
.todo-sub {
  font-size: 14px;
  color: var(--ink-soft);
  margin: 0 0 24px 0;
}

.add-row {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.add-row input {
  flex: 1;
  padding: 12px 14px;
  font-size: 15px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  outline: none;
  color: var(--ink);
  font-family: inherit;
}
.add-row input:focus { border-color: var(--accent); }
.add-row button {
  padding: 0 18px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.add-row button:hover { background: #2f5b4d; }
.add-row button:disabled { opacity: 0.4; cursor: default; }

.list {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border-bottom: 1px solid var(--line);
}
.item:last-child { border-bottom: none; }
.checkbox {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  border: 1.5px solid #c7c3b8;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  padding: 0;
  transition: all 0.15s;
}
.checkbox.done { background: var(--accent); border-color: var(--accent); }
.checkbox svg { opacity: 0; }
.checkbox.done svg { opacity: 1; }
.item-text { flex: 1; font-size: 15px; word-break: break-word; }
.item-text.done { color: var(--ink-soft); text-decoration: line-through; }
.item-del {
  background: none;
  border: none;
  color: var(--ink-soft);
  cursor: pointer;
  font-size: 18px;
  padding: 4px 6px;
  line-height: 1;
}
.item-del:hover { color: var(--danger); }

.empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 14px;
}

.footer {
  margin-top: 14px;
  font-size: 13px;
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
}
.footer button {
  background: none;
  border: none;
  color: var(--ink-soft);
  cursor: pointer;
  font-size: 13px;
  text-decoration: underline;
  padding: 0;
  font-family: inherit;
}
.footer button:hover { color: var(--danger); }
</style>

<div class="todo-root">
  <div class="todo-shell">
    <h1 class="todo-title">To-Do List</h1>
    <p class="todo-sub" id="dateLine"></p>

    <form class="add-row" id="addForm">
      <input type="text" id="newInput" placeholder="Add a task…" autofocus />
      <button type="submit" id="addBtn" disabled>Add</button>
    </form>

    <div class="list" id="list"></div>

    <div class="footer">
      <span id="countLine">0 tasks</span>
      <button id="clearDoneBtn">Clear completed</button>
    </div>
  </div>
</div>

<script>
(function () {
  let todos = [];
  let nextId = 1;

  const listEl = document.getElementById("list");
  const addForm = document.getElementById("addForm");
  const newInput = document.getElementById("newInput");
  const addBtn = document.getElementById("addBtn");
  const countLine = document.getElementById("countLine");
  const clearDoneBtn = document.getElementById("clearDoneBtn");
  const dateLine = document.getElementById("dateLine");

  dateLine.textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });

  newInput.addEventListener("input", () => {
    addBtn.disabled = !newInput.value.trim();
  });

  addForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = newInput.value.trim();
    if (!text) return;
    todos.unshift({ id: nextId++, text, done: false });
    newInput.value = "";
    addBtn.disabled = true;
    render();
  });

  listEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = Number(btn.getAttribute("data-id"));
    const action = btn.getAttribute("data-action");
    if (action === "toggle") {
      todos = todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
    } else if (action === "delete") {
      todos = todos.filter((t) => t.id !== id);
    }
    render();
  });

  clearDoneBtn.addEventListener("click", () => {
    todos = todos.filter((t) => !t.done);
    render();
  });

  function checkSvg() {
    return '<svg width="11" height="9" viewBox="0 0 11 9" fill="none">' +
      '<path d="M1 4.5L4 7.5L10 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const remaining = todos.filter((t) => !t.done).length;
    countLine.textContent = todos.length === 0
      ? "0 tasks"
      : remaining + " of " + todos.length + " remaining";

    if (todos.length === 0) {
      listEl.innerHTML = '<div class="empty">Nothing on your list yet. Add a task above.</div>';
      return;
    }

    listEl.innerHTML = todos.map((t) => (
      '<div class="item">' +
        '<button class="checkbox' + (t.done ? " done" : "") + '" data-action="toggle" data-id="' + t.id + '">' + checkSvg() + '</button>' +
        '<div class="item-text' + (t.done ? " done" : "") + '">' + escapeHtml(t.text) + '</div>' +
        '<button class="item-del" data-action="delete" data-id="' + t.id + '">×</button>' +
      '</div>'
    )).join("");
  }

  render();
})();
</script>
